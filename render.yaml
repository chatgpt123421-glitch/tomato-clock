services:
  - type: web
    name: xingzhizhu-survey
    runtime: python
    buildCommand: cd xingzhizhu-survey && pip install -r requirements.txt
    startCommand: cd xingzhizhu-survey && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FEISHU_WEBHOOK
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_SUMMARY_SPREADSHEET_TOKEN
        value: I2TcszNIhhiaFXtky4ZcUgPMnqd
      - key: FEISHU_SUMMARY_SHEET_ID
        value: 0gqQBu
      - key: FEISHU_SUMMARY_SYNC_ROWS
        value: 200
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
