services:
  - type: web
    name: xingzhizhu-survey
    runtime: python
    buildCommand: cd xingzhizhu-survey && pip install -r requirements.txt
    startCommand: cd xingzhizhu-survey && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FEISHU_WEBHOOK
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
